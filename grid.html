<!Doctype html>
<html>
    <head>
        <title>
            grid practice
        </title>
        <body style="padding-bottom:1000px;">
            
             <div style="
                display:grid;
                grid-template-columns:100px 100px;
                
                ">
                <div style="background-color:lightblue">
                    div1
                </div>
                <div style="background-color:lightpink">
                    div2
                </div>
             </div>
             <div style="
                margin-top:20px; 
                display:grid;
                grid-template-columns:100px 100px 200px;
                
                ">
                <div style="background-color:lightblue">
                    100px
                </div>
                <div style="background-color:lightpink">
                    100px
                </div>
                 <div style="background-color:lightblue">
                    200px
                </div>
             </div>
                 <div style="
                display:grid;
                grid-template-columns:100px 100px;
                
                ">
                <div style="background-color:lightblue">
                    div1
                </div>
                <div style="background-color:lightpink">
                    div2
                </div>
             </div>
             <div style="
                margin-top:20px; 
                display:grid;
                grid-template-columns:100px 1fr ;
                /* one fr means free space  */
                
                ">
                <div style="background-color:lightblue">
                    100px
                </div>
                <div style="background-color:lightpink">
                    100px
                </div>
                 
             </div>
                  <div style="
                display:grid;
                grid-template-columns:100px 100px ;
                
                ">
                <div style="background-color:lightblue">
                    div1
                </div>
                <div style="background-color:lightpink">
                    div2
                </div>
                
             </div>
             <div style="
                margin-top:20px; 
                display:grid;
                grid-template-columns:1fr 1fr 1fr;
                /* one fr means free space  */
                column-gap:20px;
                row-gap:40px;
                
                ">
                <div style="background-color:lightblue;height:2fr;"
                >
                    1fr
                </div>
                <div style="background-color:lightpink;height:200px;">
                    1fr
                </div>
                <div style="background-color:lightblue;height:200px;">
                    1fr
                </div>
                <div style="background-color:lightpink;height:200px;">
                    1fr
                </div>
                   <div style="background-color:lightblue;height:200px;">
                    1fr
                </div>
                <div style="background-color:lightpink;height:200px;">
                    1fr
                </div>
                 
             </div>
        </body>
    </head>
</html>
